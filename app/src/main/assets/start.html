<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
    background: #0f1419; color: #e8eaed;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 20px; }
  form { width: 100%; max-width: 480px; display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 14px 16px; font-size: 1rem;
    border-radius: 12px; border: 1px solid #2f3a46; background: #1a222c; color: inherit;
  }
  button {
    padding: 14px 18px; font-size: 1rem; border: 0; border-radius: 12px;
    background: #4c8dff; color: #fff; font-weight: 600;
  }
  .tiles { margin-top: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 480px; }
  .tiles a {
    padding: 16px 8px; text-align: center; text-decoration: none; color: inherit;
    background: #1a222c; border: 1px solid #2f3a46; border-radius: 12px; font-size: .95rem;
  }
  p { margin-top: 28px; color: #8b96a3; font-size: .85rem; text-align: center; max-width: 380px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>Full Screen Browser</h1>
  <form onsubmit="go(event)">
    <input id="q" type="text" inputmode="url" autocapitalize="none" autocomplete="off"
           placeholder="Search or type a website">
    <button type="submit">Go</button>
  </form>
  <div class="tiles">
    <a href="https://www.google.com">Google</a>
    <a href="https://www.youtube.com">YouTube</a>
    <a href="https://www.wikipedia.org">Wikipedia</a>
  </div>
  <p>Swipe down from the top of a page to refresh. Press Back to return here. Swipe from the top or bottom edge of the screen to peek at the system bars.</p>
<script>
  function go(e) {
    e.preventDefault();
    var q = document.getElementById('q').value.trim();
    if (!q) return;
    var u;
    if (/^https?:\/\//i.test(q)) u = q;
    else if (/^[^\s]+\.[^\s]{2,}$/.test(q)) u = 'https://' + q;
    else u = 'https://www.google.com/search?q=' + encodeURIComponent(q);
    location.href = u;
  }
</script>
</body>
</html>
