name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Refresh ad blocklist (keeps the bundled list if this fails)
        run: |
          curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts \
            | awk '/^0\.0\.0\.0 /{print tolower($2)}' \
            | grep -v -E '^(0\.0\.0\.0|localhost.*|local|broadcasthost|googletagmanager\.com)$' \
            | sort -u > /tmp/blocklist.txt || true
          if [ "$(wc -l < /tmp/blocklist.txt)" -gt 10000 ]; then
            cp /tmp/blocklist.txt app/src/main/assets/blocklist.txt
            echo "Blocklist refreshed"
          else
            echo "Using bundled blocklist"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FullScreenBrowser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
